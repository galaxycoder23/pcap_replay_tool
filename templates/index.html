<!DOCTYPE HTML>
<html>
  <head>
    <title>PCAP upload</title>
  </head>
  <body>
    <h1>PCAP upload</h1>
    <p>Replay traffic here:</p>
    <form action="" method="POST">
      <input type="file" id="filepath" name="filepath">
      <div class="interactive">
        <button type="submit" value="Send">Replay traffic</button>
      </div>
    </form>
    {% if path %}
      <p id="path" class="path"><strong>Path:</strong> {{ path }}</p>
    {% endif %}
  </body>
</html>
