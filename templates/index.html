<!DOCTYPE HTML>
<html>
  <head>
    <title>PCAP upload</title>
  </head>
  <body>
    <h1>PCAP upload</h1>
    <p>Replay traffic here:</p>
    <form action="" method="POST">
      <input type="file" id="path" name="filename">
      <div class="interactive">
        <input type="submit" value="Send">Replay traffic</button>
      </div>
    </form>
    {% if path %}
      <p class="path"><strong>Path:</strong> {{ error }}</p>
    {% endif %}
  </body>
</html>
